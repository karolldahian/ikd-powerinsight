[project]
name = "powerinsight"
version = "0.1.0"
description = "Backend de IKD PowerInsight"
readme = "README.md"
authors = [
    { name = "karolldahian", email = "kdrm1207@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
powerinsight = "powerinsight:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]
